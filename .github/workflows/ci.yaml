name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.18.1
      - name: Get Version
        run: npm -v
      - name: Install modules

        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm test
      # the app type-checks against @gen3/chat's built dist/, which is never committed
      - name: Build chat package
        run: npm run build -w @gen3/chat
      - name: Typecheck
        run: npm run typecheck
